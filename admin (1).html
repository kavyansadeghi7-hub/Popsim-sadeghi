<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت پاپ سیم</title><style>
*{box-sizing:border-box}body{margin:0;background:#100e0a;color:#f4ead5;font-family:Tahoma,Arial,sans-serif;padding:20px}.wrap{max-width:1050px;margin:auto}.panel{background:#1b1811;border:1px solid #6c5126;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #0006}h1,h2{color:#f0d18b}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #735a30;background:#0e0c09;color:#fff;width:100%}button{background:linear-gradient(135deg,#a87927,#f3d68f);color:#170f05;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted{color:#c6b99e;font-size:13px;line-height:1.9}.item{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #44351f;padding:12px 0}.danger{background:#4a2119;color:#fff;border-color:#8b4333}.hidden{display:none!important}.warn{color:#ffd78b;background:#352811;padding:12px;border-radius:10px;line-height:1.9}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr 1fr}.item button{grid-column:1/-1}}
</style><body><div class="wrap"><header class="row"><div><h1>POP SIM | پنل مدیریت</h1><div class="muted">مدیریت موجودی شماره‌های سیم‌کارت</div></div><a href="index.html" style="color:#f0d18b">مشاهده فروشگاه مشتری</a></header>
<section id="login" class="panel"><h2>ورود مدیر</h2><p class="muted">رمز پیش‌فرض نمایشی: 123456 — پس از ورود آن را تغییر بده.</p><div class="row"><input id="pin" type="password" placeholder="رمز ورود"><button onclick="login()">ورود به پنل</button></div><p id="loginmsg" class="muted"></p></section>
<div id="app" class="hidden">
<section class="panel"><h2>افزودن شماره جدید</h2><div class="grid"><input id="num" placeholder="شماره کامل" inputmode="numeric"><select id="op"><option>ایرانسل</option><option>همراه اول</option></select><select id="type"><option>اعتباری</option><option>دائمی</option><option>نامشخص</option></select><select id="cat"><option>معمولی</option><option>نیمه‌رند</option><option>رند</option></select><input id="price" type="number" placeholder="قیمت به تومان"><input id="pattern" placeholder="الگوی شماره (مثلاً جفت‌جفت)"><select id="status"><option>صفر</option><option>کارکرده</option><option>در حد صفر</option><option>ناموجود</option></select><button onclick="add()">ثبت شماره</button></div></section>
<section class="panel"><div class="row"><h2>موجودی شماره‌ها</h2><button onclick="exportData()">خروجی پشتیبان JSON</button><button class="danger" onclick="logout()">خروج</button></div><div id="list"></div></section></div></div>
<script>
const KEY='popsim_items', PINKEY='popsim_admin_pin';let data=[];
function login(){let p=document.getElementById('pin').value;let saved=localStorage.getItem(PINKEY)||'123456';if(p!==saved){document.getElementById('loginmsg').textContent='رمز نادرست است';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');data=JSON.parse(localStorage.getItem(KEY)||'[]');render()}
function add(){let n=document.getElementById('num').value.replace(/\D/g,'');if(n.length<10){alert('شماره را کامل وارد کن');return}if(data.some(x=>x.number===n)){alert('این شماره قبلاً ثبت شده');return}data.unshift({number:n,operator:op.value,lineType:type.value,category:cat.value,price:Number(price.value)||null,pattern:pattern.value||'—',status:status.value,source:'ثبت توسط مدیر',checked:new Date().toISOString().slice(0,10),url:'',note:'موجودی ثبت‌شده'});save();num.value='';price.value='';pattern.value=''}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function remove(n){if(confirm('این شماره حذف شود؟')){data=data.filter(x=>x.number!==n);save()}}
function render(){document.getElementById('list').innerHTML=data.map(x=>`<div class="item"><b>${x.number}</b><span>${x.operator} | ${x.category}</span><span>${x.price?Number(x.price).toLocaleString('fa-IR')+' تومان':'قیمت توافقی'}</span><button class="danger" onclick="remove('${x.number}')">حذف</button></div>`).join('')||'<p class="muted">هنوز شماره‌ای ثبت نشده است.</p>'}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='popsim-backup.json';a.click();URL.revokeObjectURL(a.href)}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');pin.value=''}
</script></body></html>
